# --- Listener chiffré (TLS), uniquement en local ---
listener 8883 127.0.0.1
cafile   C:/Users/YAZID/Documents/mini-projet-iiot/2-broker/certs/ca.crt
certfile C:/Users/YAZID/Documents/mini-projet-iiot/2-broker/certs/server.crt
keyfile  C:/Users/YAZID/Documents/mini-projet-iiot/2-broker/certs/server.key
tls_version tlsv1.2

# --- Authentification et droits ---
allow_anonymous false
password_file C:/Users/YAZID/Documents/mini-projet-iiot/2-broker/passwd
acl_file      C:/Users/YAZID/Documents/mini-projet-iiot/2-broker/acl
# --- Logs : à l'écran ET dans un fichier ---
log_dest stdout
log_dest file C:/Users/YAZID/Documents/mini-projet-iiot/2-broker/logs/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%d %H:%M:%S